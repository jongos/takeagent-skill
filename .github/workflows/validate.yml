name: Validate skill package
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || github.sha }}
      - name: Install pinned build dependencies
        run: python3 -m pip install -r requirements-build.txt
      - name: Run regression tests and check version links
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/sync_version.py --check
          python3 scripts/content_policy.py
      - name: Build and verify the skill archive
        run: |
          python3 scripts/package_skill.py
          cd dist
          sha256sum --check takeagent-skill.zip.sha256
      - name: Scan history and expanded package for secrets
        shell: bash
        run: |
          scanner_dir="$(mktemp -d)"
          curl --fail --silent --show-error --location --retry 2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$scanner_dir/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $scanner_dir/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$scanner_dir/gitleaks.tar.gz" -C "$scanner_dir" gitleaks
          "$scanner_dir/gitleaks" git . --log-opts="--all" --redact
          python3 -m zipfile -e dist/takeagent-skill.zip "$scanner_dir/package"
          "$scanner_dir/gitleaks" dir "$scanner_dir/package" --redact
      - name: Compare published assets with the release-tag build
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release download "$RELEASE_TAG" --dir downloaded -p 'takeagent-skill.zip*'
          python3 scripts/verify_release.py --tag "$RELEASE_TAG"
  attest:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}
      - name: Install pinned build dependencies
        run: python3 -m pip install -r requirements-build.txt
      - name: Build release archive for attestation
        run: python3 scripts/package_skill.py
      - name: Attest release archive provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: dist/takeagent-skill.zip